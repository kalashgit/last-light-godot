name: M02 Pinned F02 F03 F10 F11 F12 Engine Calibration
# Pinned source commits execute without repository credentials or promotion authority.

on:
  pull_request:
    paths:
      - '.github/workflows/m02-cross-family-calibration.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m02-pinned-family-calibration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  specialist-evidence:
    # Only exact-branch, same-repo PRs may run these read-only pinned engines.
    # Unrelated F01 source updates will not re-trigger a five-family matrix.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.head_ref == 'codex/m02-autonomous-asset-factory-v1')
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - family: F02
            sha: bb2e88833d82a7a17849497f5799ef3654a6720d
          - family: F03
            sha: bb0d673cb79af5b4ac526931ec543a87ec18b6f9
          - family: F10
            sha: 8cd11e3209f4ec5e357ee1830efbb2d42d85e6c1
          - family: F11
            sha: 986f3ef3c1df88e3c32d35bacf28052a3ecd4c16
          - family: F12
            sha: eba8e2c6d78bbc41b2de413d176d805b6c288337
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact immutable specialist source
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install bounded rendering and analysis dependencies
        run: |
          python -m pip install 'Pillow>=10,<13' 'numpy>=1.24,<3'
          sudo apt-get update -qq
          # Blender 5 on ubuntu-latest can require system EGL/OpenGL libraries
          # even for an entirely headless, CPU-only renderer.
          sudo apt-get install -y blender python3-numpy libegl1 libgl1 libopengl0
          blender --version
      - name: Execute actual pinned specialist renderer and QA
        env:
          FAMILY: ${{ matrix.family }}
          SOURCE_SHA: ${{ matrix.sha }}
        run: |
          set -euo pipefail
          mkdir -p build/m02-cross
          printf 'family=%s\nsource_sha=%s\n' "$FAMILY" "$SOURCE_SHA" > build/m02-cross/provenance.txt
          case "$FAMILY" in
            F02)
              python -m unittest discover -s tests/factory/structures -p 'test_*.py' -v
              python tools/factory/structures/textures.py --output-dir build/m02-cross/textures
              # Integration-only compatibility shim: Blender 5.0 renamed Eevee NEXT.
              python - <<'PY'
          from pathlib import Path
          p=Path('tools/factory/structures/blender_calibration.py')
          s=p.read_text()
          assert '"BLENDER_EEVEE_NEXT"' in s
          p.write_text(s.replace('"BLENDER_EEVEE_NEXT"','"BLENDER_EEVEE"'))
          Path('build/m02-cross/compatibility_shim.txt').write_text('Blender 5.0: BLENDER_EEVEE_NEXT -> BLENDER_EEVEE; source revision unchanged upstream\n')
          PY
              blender -b --factory-startup --python-exit-code 3 -t 2 --python tools/factory/structures/blender_calibration.py -- --subject all --output-dir build/m02-cross
              python tools/factory/structures/qa_package.py --output-dir build/m02-cross
              ;;
            F03)
              python tools/f03_engine_v13/generate.py
              mkdir -p tools/f03_engine_v13/evidence
              blender -b --factory-startup --python-exit-code 3 -t 2 --python tools/f03_engine_v13/blender_source.py -- --out tools/f03_engine_v13/evidence
              curl -fL --retry 2 --max-time 90 -o /tmp/m02_godot.zip https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
              unzip -q /tmp/m02_godot.zip -d /tmp
              /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path tools/f03_engine_v13/godot --editor --import --quit
              /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path tools/f03_engine_v13/godot --script res://native_test.gd | tee build/m02-cross/godot.log
              grep -q 'F03_NATIVE_IMPORT_PASS' build/m02-cross/godot.log
              ;;
            F10)
              # Upstream F10 calibration already supports Blender 5 and its own
              # object naming. Do not monkeypatch its mesh/object identifiers.
              blender -b --factory-startup --python-exit-code 3 -t 2 --python tools/vehicle_factory/hero_door_clearance.py -- --output build/m02-cross/clearance.json
              blender -b --factory-startup --python-exit-code 3 -t 2 --python tools/vehicle_factory/hero_door_calibration.py -- --output build/m02-cross/raw --samples 2 --heading-deg 45
              python tests/factory/vehicles/test_f10_hero_door.py build/m02-cross/raw
              blender -b build/m02-cross/raw/hero_front_door_calibration.blend --python-exit-code 3 --python-expr "import bpy; bpy.ops.export_scene.gltf(filepath='build/m02-cross/door.glb',export_format='GLB',export_animations=True)"
              python tools/vehicle_factory/verify_door_glb.py build/m02-cross/door.glb
              python - <<'PY'
          import json
          from pathlib import Path
          record=json.loads(Path('build/m02-cross/clearance.json').read_text())
          assert record['verdict']=='NO_SAMPLED_TRIANGLE_CONTACT',record
          print('M02_F10_CLEARANCE_PASS')
          PY
              ;;
            F11)
              python tools/material_factory/generate.py --size 256 --out build/m02-cross/materials
              python tools/material_factory/validate.py build/m02-cross/materials
              ;;
            F12)
              python -m unittest discover -s tests/factory/render_bridge -v
              blender -b --factory-startup --python-exit-code 3 -t 2 --python tools/factory/render_bridge/calibrate.py -- --output build/m02-cross/render
              F12_CAL_REPORT="$PWD/build/m02-cross/render/CAL-01_report.json" python -m unittest discover -s tests/factory/render_bridge -p test_calibration.py -v
              ;;
          esac
          printf 'TECHNICAL_CANDIDATE_ONLY_NOT_GOLDEN\n' > build/m02-cross/approval.txt
      - name: Upload verified results and failure diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m02-${{ matrix.family }}-pinned-${{ github.run_id }}
          path: build/m02-cross/
          retention-days: 5
          if-no-files-found: warn
