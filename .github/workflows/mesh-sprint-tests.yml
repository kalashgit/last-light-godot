name: mesh-sprint-candidate-tests
on:
  push:
    paths:
      - 'tools/mesh_sprint/**'
      - 'tests/test_factory.py'
      - 'tests/test_verify.py'
      - 'tests/test_quality_geometry.py'
      - 'requirements.txt'
      - '.github/workflows/mesh-sprint-tests.yml'
  pull_request:
    paths:
      - 'tools/mesh_sprint/**'
      - 'tests/test_factory.py'
      - 'tests/test_verify.py'
      - 'tests/test_quality_geometry.py'
      - 'requirements.txt'
      - '.github/workflows/mesh-sprint-tests.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r tools/mesh_sprint/requirements.txt
      - run: python -m pytest -q tests/test_factory.py tests/test_verify.py tests/test_quality_geometry.py
      - name: Small real file smoke test
        run: |
          python tools/mesh_sprint/factory.py --demo 48 --out /tmp/ll-mesh-ci --workers 2
          python tools/mesh_sprint/verify.py --root /tmp/ll-mesh-ci
