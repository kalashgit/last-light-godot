name: Content catalog validation

on:
  push:
    paths:
      - "data/catalog/**"
      - "tools/validate_catalog.py"
      - "tests/test_catalog_design.py"
      - ".github/workflows/content-catalog.yml"
  pull_request:
    paths:
      - "data/catalog/**"
      - "tools/validate_catalog.py"
      - "tests/test_catalog_design.py"
      - ".github/workflows/content-catalog.yml"

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check catalog cross-references
        run: python tools/validate_catalog.py data/catalog/starter_v1.json
      - name: Verify catalog rejects invalid records
        run: python -m unittest discover -s tests -p 'test_catalog_design.py' -v
