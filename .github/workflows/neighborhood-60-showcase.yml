name: LAST LIGHT 60-Archetype Neighborhood Prototype QA

on:
  pull_request:
    paths:
      - "data/neighborhood/**"
      - "scripts/neighborhood_60_showcase.gd"
      - "scenes/neighborhood_60_showcase.tscn"
      - "tests/neighborhood_60/**"
      - ".github/workflows/neighborhood-60-showcase.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neighborhood-60-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  neighborhood-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify deterministic 60-archetype coverage and parcel geometry
        run: python -m unittest discover -s tests/neighborhood_60 -p 'test_*.py' -v
      - name: Install Godot 4.3 stable
        run: |
          curl --fail --location --silent --show-error --retry 3 \
            "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip" \
            --output /tmp/godot43.zip
          unzip -q /tmp/godot43.zip -d /tmp/godot43
          chmod +x /tmp/godot43/Godot_v4.3-stable_linux.x86_64
          /tmp/godot43/Godot_v4.3-stable_linux.x86_64 --headless --version
      - name: Execute actual Godot 4.3 neighborhood and interaction smoke test
        run: |
          timeout 70s /tmp/godot43/Godot_v4.3-stable_linux.x86_64 \
            --headless --path . --script res://tests/neighborhood_60/smoke.gd
