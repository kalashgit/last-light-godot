name: Blender 2.5D original sprite pilot
on:
  workflow_dispatch:
  push:
    branches:
      - "codex/blender-*"
    paths:
      - "tools/blender_factory/**"
      - ".github/workflows/blender-sprite-pilot.yml"
  pull_request:
    paths:
      - "tools/blender_factory/**"
      - ".github/workflows/blender-sprite-pilot.yml"

permissions:
  contents: write

jobs:
  render-original-isometric:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout isolated sprite-factory branch
        uses: actions/checkout@v4
      - name: Install free Blender CPU renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender
          blender --version | head -n 2
      - name: Render four original 3D furniture models to RGBA PNG
        run: |
          mkdir -p build/blender_factory/raw
          blender -b --factory-startup -t 2 --python tools/blender_factory/render_pilot.py -- --output build/blender_factory/raw
      - name: Set up post-processing
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: python -m pip install "Pillow>=10,<15"
      - name: Package true world-scale isometric art and metadata
        run: python tools/blender_factory/package.py --input build/blender_factory/raw --output build/blender_factory/game_ready
      - name: Validate output contract and transparent images
        run: python tools/blender_factory/validate.py build/blender_factory/game_ready
      - name: Publish direct-download ZIP on isolated pilot branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/codex/blender-25d-cloud-sprite-pilot'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p tools/blender_factory/output
          cp build/blender_factory/last-light-blender-pilot.zip tools/blender_factory/output/last-light-blender-pilot.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/blender_factory/output/last-light-blender-pilot.zip
          if ! git diff --cached --quiet; then
            git commit -m "Publish verified four-model Blender sprite ZIP for direct iPhone download"
            git push origin HEAD:codex/blender-25d-cloud-sprite-pilot
          fi
      - name: Upload iPhone-downloadable sprite pack and manifest
        uses: actions/upload-artifact@v4
        with:
          name: last-light-blender-2-5d-four-object-pilot
          path: |
            build/blender_factory/last-light-blender-pilot.zip
            build/blender_factory/game_ready/manifest.json
          if-no-files-found: error
          retention-days: 14
