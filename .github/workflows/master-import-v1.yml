name: LAST LIGHT master asset import + single-map QA V1
on:
  push:
    branches:
      - codex/last-light-master-import-scale-v1-20261107
    paths:
      - "tools/unified_factory/import_godot.py"
      - "tests/master_import_v1.py"
      - "tests/master_factory_import.gd"
      - "scenes/master_factory_import_lab.tscn"
      - "scripts/master_factory_import_lab.gd"
      - ".github/workflows/master-import-v1.yml"
  workflow_dispatch:

concurrency:
  group: last-light-master-import-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  import-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Import all existing original sprite candidates and test deterministic caching
        run: python tests/master_import_v1.py
      - name: Re-run clean deterministic import
        run: python tools/unified_factory/import_godot.py --project . --output assets/generated/master_import_v1
      - name: Archive generated Godot resources and import catalog
        uses: actions/upload-artifact@v4
        with:
          name: last-light-master-import-311-candidates
          path: assets/generated/master_import_v1
          retention-days: 14
          if-no-files-found: error

  godot-real-import-and-map:
    needs: import-regression
    runs-on: ubuntu-latest
    container: barichello/godot-ci:4.6.3
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Check available Python interpreter
        run: |
          if command -v python3 >/dev/null 2>&1; then
            python3 --version
          else
            apt-get update -qq
            apt-get install -y python3
          fi
      - name: Generate reproducible Godot SpriteFrames and scene files from real PNGs
        run: python3 tools/unified_factory/import_godot.py --project . --output assets/generated/master_import_v1
      - name: Godot native headless import
        run: godot --headless --path . --editor --import
      - name: Verify 311 real resource files and one continuous visual test map
        run: godot --headless --path . --script tests/master_factory_import.gd

  publish-reviewed-candidates:
    needs: [import-regression, godot-real-import-and-map]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate validated Godot resource sources for versioned master index
        run: python tools/unified_factory/import_godot.py --project . --output assets/generated/master_import_v1
      - name: Commit reproducible scene/resource index on isolated branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/generated/master_import_v1
          if ! git diff --cached --quiet; then
            git commit -m "Publish mechanically validated Godot master-import candidate resources"
            for attempt in 1 2 3; do
              git fetch origin codex/last-light-master-import-scale-v1-20261107
              git rebase origin/codex/last-light-master-import-scale-v1-20261107
              if git push origin HEAD:codex/last-light-master-import-scale-v1-20261107; then
                exit 0
              fi
            done
            echo "Resource publication failed safely (no force push)" >&2
            exit 1
          fi
