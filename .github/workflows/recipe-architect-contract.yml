name: Recipe Architect CPU contract
on:
  pull_request:
    paths:
      - 'tools/recipe_architect/**'
      - 'tests/recipe_architect/**'
      - 'data/foundry_recipe_architect/**'
      - '.github/workflows/recipe-architect-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: CPU-only dependencies
        run: python -m pip install --disable-pip-version-check 'Pillow>=10,<12' 'numpy>=1.26,<3' 'jsonschema>=4,<5'
      - name: Test allowlisted recipe contract and offline vision safeguards
        run: python -m unittest discover -s tests/recipe_architect -v
      - name: Reproduce three SHA-pinned technical recipe manifests
        run: |
          python -m tools.recipe_architect.seed_recipes
          git diff --exit-code -- data/foundry_recipe_architect
