name: LAST LIGHT Full Fidelity Geometry Refinement V2
on:
  push:
    branches:
      - codex/last-light-full-fidelity-refinement-v2-20261108
    paths:
      - "tools/geometry_first/**"
      - "tests/refinement_contract_v2.py"
      - ".github/workflows/full-fidelity-refinement-v2.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ll-full-fidelity-${{ github.ref }}
  cancel-in-progress: true
jobs:
  original-source-geometry-review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BATCH_ASSET_IDS: ll_master_vehicle_compact_hatchback,ll_master_vehicle_city_sedan,ll_master_vehicle_family_wagon,ll_master_vehicle_compact_suv,ll_master_vehicle_work_pickup,ll_master_vehicle_sport_coupe,ll_master_vehicle_service_security,ll_tools_awl,ll_tools_cross_screwdriver,ll_tools_flat_screwdriver,ll_tools_crowbar
      BATCH_COUNT: 11
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify all-360 transferable refinement specification
        run: |
          python tests/refinement_contract_v2.py
          mkdir -p build/refinement_v2
          python tools/geometry_first/plan.py --asset-ids "$BATCH_ASSET_IDS" --output build/refinement_v2/plan.json
      - name: Install Blender and PNG verification tools
        run: |
          python -m pip install "Pillow>=10,<15"
          sudo apt-get update -qq
          sudo apt-get install -y blender python3-numpy
      - name: Reconstruct BASELINE V1 3D geometry without overwriting original archive
        run: |
          set -o pipefail
          blender -b --factory-startup -t 2 --python tools/geometry_first/export.py -- --plan build/refinement_v2/plan.json --output build/refinement_v2/baseline_models --max-jobs "$BATCH_COUNT" --preview-every 1 --refinement-profile v1 2>&1 | tee build/refinement_v2/baseline.log
          grep -q "LL_GEOMETRY_BATCH_PASS $BATCH_COUNT $BATCH_COUNT" build/refinement_v2/baseline.log
      - name: Build 11 genuine V2 geometry refinements with versioned source recipes
        run: |
          set -o pipefail
          blender -b --factory-startup -t 2 --python tools/geometry_first/export.py -- --plan build/refinement_v2/plan.json --output build/refinement_v2/refined_models --max-jobs "$BATCH_COUNT" --preview-every 1 --refinement-profile v2 2>&1 | tee build/refinement_v2/refined.log
          grep -q "LL_GEOMETRY_BATCH_PASS $BATCH_COUNT $BATCH_COUNT" build/refinement_v2/refined.log
      - name: Reopen Blender files and assert actual new roof panes and tool shaft geometry
        run: |
          set -o pipefail
          blender -b --factory-startup -t 2 --python tools/geometry_first/verify_refinement_v2.py -- --sources build/refinement_v2/refined_models --asset-ids "$BATCH_ASSET_IDS" 2>&1 | tee build/refinement_v2/blender_inspection.log
          grep -q "LL_REFINEMENT_BLENDER_ALL_PASS $BATCH_COUNT" build/refinement_v2/blender_inspection.log
      - name: Compare before versus after and package editable mesh files
        run: |
          python tools/geometry_first/qa.py --sources build/refinement_v2/refined_models --expected "$BATCH_COUNT" --sheet build/refinement_v2/refined_geometry_sheet.png --zip build/refinement_v2/Last_Light_Refined_3D_Masters_V2_Batch_11.zip
          python tools/geometry_first/compare_v2.py --baseline build/refinement_v2/baseline_models --refined build/refinement_v2/refined_models --expected "$BATCH_COUNT" --out build/refinement_v2/before_after_geometry.png --report build/refinement_v2/refined_report.json
          python tools/geometry_first/refinement_ledger_v2.py --refined-report build/refinement_v2/refined_report.json --out build/refinement_v2/geometry_refinement_ledger_v2.json
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("build/refinement_v2")
          x=json.loads((root/"geometry_refinement_ledger_v2.json").read_text())
          assert x["counts"]["source_models"]==360
          assert x["counts"]["refined_geometry_verified"]==11
          assert x["counts"]["remaining_refinements"]==349
          assert x["counts"]["golden_visual_approved"]==0
          print("LL_REFINEMENT_COVERAGE_QA_PASS 11 of 360 geometries, 0 Golden approvals")
          PY
      - name: Render real updated 3D models back into fixed camera 2.5D
        run: |
          set -o pipefail
          blender -b --factory-startup -t 2 --python tools/geometry_first/stage2_render.py -- --sources build/refinement_v2/refined_models --output build/refinement_v2/isometric --asset-ids ll_master_vehicle_compact_hatchback,ll_tools_awl,ll_tools_crowbar --vehicle-headings 16 --samples 8 2>&1 | tee build/refinement_v2/isometric.log
          grep -q 'LL_SOURCE_TO_2_5D_PASS 18' build/refinement_v2/isometric.log
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image,ImageDraw
          root=Path("build/refinement_v2/isometric")
          frames=json.loads((root/"render_report.json").read_text())["frames"]
          assert len(frames)==18
          vehicle=[x for x in frames if x["asset_id"]=="ll_master_vehicle_compact_hatchback"]
          assert len(vehicle)==16
          assert [x["heading_deg"] for x in vehicle]==[i*22.5 for i in range(16)]
          dst=Image.new("RGB",(6*210,3*232),(55,57,53))
          pen=ImageDraw.Draw(dst)
          for i,frame in enumerate(frames):
              img=Image.open(root/frame["path"]).convert("RGBA")
              assert img.getchannel("A").getbbox()
              img.thumbnail((204,204))
              background=Image.new("RGBA",(204,205),(87,91,88,255))
              background.alpha_composite(img,((204-img.width)//2,(205-img.height)//2))
              x=i%6*210;y=i//6*232
              dst.paste(background.convert("RGB"),(x+3,y+3))
              pen.text((x+3,y+210),frame["asset_id"][-22:]+" "+str(frame["heading_deg"]),fill=(230,231,222))
          dst.save("build/refinement_v2/2_5d_render_review.png")
          print("LL_REFINED_ISO_REPLAY_QA_PASS 18 frames, 16 vehicle headings")
          PY
      - name: Publish evidence and exact census accounting on isolated branch
        run: |
          set -euo pipefail
          # GitHub runs may overlap. Publish on TOP of the CURRENT remote
          # branch, not by rebasing old binary previews into new binary previews.
          stage="$(mktemp -d)"
          cp build/refinement_v2/before_after_geometry.png "$stage/"
          cp build/refinement_v2/refined_geometry_sheet.png "$stage/"
          cp build/refinement_v2/2_5d_render_review.png "$stage/"
          cp build/refinement_v2/refined_report.json "$stage/"
          cp build/refinement_v2/geometry_refinement_ledger_v2.json "$stage/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch --no-tags origin codex/last-light-full-fidelity-refinement-v2-20261108
            git reset --hard origin/codex/last-light-full-fidelity-refinement-v2-20261108
            mkdir -p preview/geometry-refinement-v2
            cp "$stage/before_after_geometry.png" preview/geometry-refinement-v2/
            cp "$stage/refined_geometry_sheet.png" preview/geometry-refinement-v2/
            cp "$stage/2_5d_render_review.png" preview/geometry-refinement-v2/
            cp "$stage/refined_report.json" preview/geometry-refinement-v2/
            cp "$stage/geometry_refinement_ledger_v2.json" assets/master_library/geometry_refinement_ledger_v2.json
            git add preview/geometry-refinement-v2 assets/master_library/geometry_refinement_ledger_v2.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Publish latest source geometry refinements, 360 ledger and comparisons"
            if git push origin HEAD:codex/last-light-full-fidelity-refinement-v2-20261108; then exit 0; fi
          done
          echo "Refinement preview could not publish after three safe retries" >&2
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: last-light-v2-source-refinement-11-models-and-2_5d
          path: |
            build/refinement_v2/Last_Light_Refined_3D_Masters_V2_Batch_11.zip
            build/refinement_v2/*.png
            build/refinement_v2/*.json
            build/refinement_v2/*.log
            build/refinement_v2/isometric
          retention-days: 30
          if-no-files-found: error
