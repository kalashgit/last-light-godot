name: F05 noncanonical character calibration
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/actor_factory/f05_*.py'
      - 'tools/actor_factory/tests/test_f05*.py'
      - 'tests/f05_godot_integration.gd'
      - '.github/workflows/f05-calibration.yml'
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fail-closed validator regression tests
        run: python -m unittest discover -s tools/actor_factory/tests -p 'test_f05*.py' -v
  blender-calibration:
    runs-on: ubuntu-latest
    needs: unit-tests
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        physique: [lean, broad]
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender and headless OpenGL/EGL software dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends blender python3-numpy python3-pil libegl1 libgl1 libgl1-mesa-dri libglx-mesa0 libopengl0 libgles2 mesa-utils xvfb libxrender1 libxi6 libxrandr2 libxfixes3 libxcursor1
          blender --version
          /usr/bin/python3 -c 'import numpy; print("system numpy", numpy.__version__)'
          ldconfig -p | grep -E 'libEGL.so.1|libGL.so.1'
          test -f /usr/lib/x86_64-linux-gnu/libEGL.so.1
      - name: Generate noncanonical source, render and GLB
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_LOADER_DRIVER_OVERRIDE: llvmpipe
          QT_QPA_PLATFORM: offscreen
        run: |
          mkdir -p build/f05-cal
          set -o pipefail
          xvfb-run -a blender -b --factory-startup -t 2 --python tools/actor_factory/f05_rig_calibration.py -- --output build/f05-cal --physique ${{ matrix.physique }} 2>&1 | tee build/f05-blender.log
      - name: Validate artifact integrity (fails on missing GLB)
        run: python3 tools/actor_factory/f05_validate.py build/f05-cal
      - name: Full evaluated joint intersections and sole contact
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_LOADER_DRIVER_OVERRIDE: llvmpipe
          QT_QPA_PLATFORM: offscreen
        run: |
          set -o pipefail
          xvfb-run -a blender -b --factory-startup -t 2 --python tools/actor_factory/f05_joint_qa.py -- --output build/f05-cal 2>&1 | tee build/f05-joint.log
      - name: Install pinned Godot 4 engine for real project import
        run: |
          curl -fSL --retry 3 https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip -o /tmp/f05-godot.zip
          mkdir -p /tmp/f05-godot
          unzip -q /tmp/f05-godot.zip -d /tmp/f05-godot
          chmod +x /tmp/f05-godot/Godot_v4.4.1-stable_linux.x86_64
          /tmp/f05-godot/Godot_v4.4.1-stable_linux.x86_64 --version
      - name: Import GLB into the actual LAST LIGHT Godot project
        run: |
          mkdir -p tests/fixtures
          cp build/f05-cal/f05_noncanonical_calibration.glb tests/fixtures/f05_noncanonical_calibration.glb
          set -o pipefail
          /tmp/f05-godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path . --editor --import 2>&1 | tee build/f05-godot-import.log
      - name: Godot skinned-mesh, animation and playable physics test
        run: |
          set -o pipefail
          /tmp/f05-godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path . --script res://tests/f05_godot_integration.gd -- --output "$PWD/build/f05-cal/godot_qa.json" 2>&1 | tee build/f05-godot-smoke.log
      - name: Render actual animation poses and screen garment clipping
        if: always()
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_LOADER_DRIVER_OVERRIDE: llvmpipe
          QT_QPA_PLATFORM: offscreen
        run: |
          test -s build/f05-cal/f05_noncanonical_calibration.blend
          set -o pipefail
          xvfb-run -a blender -b --factory-startup -t 2 --python tools/actor_factory/f05_motion_qa.py -- --output build/f05-cal 2>&1 | tee build/f05-motion.log
      - name: Assemble inspectable motion contact sheet
        if: always()
        run: |
          /usr/bin/python3 tools/actor_factory/f05_contact_sheet.py build/f05-cal --log-preview
      - name: Archive calibration evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f05-noncanonical-${{ matrix.physique }}
          path: |
            build/f05-cal/
            build/f05-blender.log
            build/f05-motion.log
            build/f05-joint.log
            build/f05-godot-import.log
            build/f05-godot-smoke.log
          if-no-files-found: warn
          retention-days: 14
