name: F05 noncanonical character calibration
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/actor_factory/f05_*.py'
      - 'tools/actor_factory/tests/test_f05*.py'
      - '.github/workflows/f05-calibration.yml'
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fail-closed validator regression tests
        run: python -m unittest discover -s tools/actor_factory/tests -p 'test_f05*.py' -v
  blender-calibration:
    runs-on: ubuntu-latest
    needs: unit-tests
    strategy:
      fail-fast: false
      matrix:
        physique: [lean, broad]
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender from Ubuntu packages
        run: |
          sudo apt-get update
          sudo apt-get install -y blender
          blender --version
      - name: Generate noncanonical source, render and GLB
        run: |
          mkdir -p build/f05-cal
          set -o pipefail
          blender -b --factory-startup --python tools/actor_factory/f05_rig_calibration.py -- --output build/f05-cal --physique ${{ matrix.physique }} 2>&1 | tee build/f05-blender.log
      - name: Validate artifact integrity (fails on missing GLB)
        run: python3 tools/actor_factory/f05_validate.py build/f05-cal
      - name: Archive calibration evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f05-noncanonical-${{ matrix.physique }}
          path: |
            build/f05-cal/
            build/f05-blender.log
          if-no-files-found: warn
          retention-days: 14
