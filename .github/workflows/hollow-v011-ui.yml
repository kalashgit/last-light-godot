name: Hollow County V0.11 UI Regression
on:
  pull_request:
    paths:
      - "prototypes/hollow-county/v011/**"
      - ".github/workflows/hollow-v011-ui.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Playwright Chromium
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Run interactive UI regression suite
        run: python prototypes/hollow-county/v011/tests/test_ui.py
