name: Foundry private R2 source archive (explicit owner opt-in)
on:
  workflow_dispatch:
    inputs:
      source_class:
        type: choice
        required: true
        options: ['legacy-360', 'created-candidates']
      created_run_id:
        description: 'For created-candidates only: the exact generating run ID'
        type: string
        required: false

permissions:
  contents: read
concurrency:
  group: foundry-r2-archive-serialized
  cancel-in-progress: false
jobs:
  archive:
    if: github.actor == 'kalashgit' && github.ref == 'refs/heads/main' && vars.FOUNDRY_R2_ARCHIVE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests/foundry_autonomy -v
      - run: python -m pip install 'boto3>=1.35,<2'
      - name: Download original verified candidate source release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_CLASS: ${{ inputs.source_class }}
          CREATED_RUN_ID: ${{ inputs.created_run_id }}
        run: |
          set -euo pipefail
          mkdir -p build/foundry_r2
          if [[ "$SOURCE_CLASS" == 'legacy-360' ]]; then
            tag='foundry-360-source-v1'
            asset='Last_Light_3D_Masters_All_360.zip'
          else
            [[ "$CREATED_RUN_ID" =~ ^[0-9]{1,18}$ ]] || exit 2
            tag="foundry-created-$CREATED_RUN_ID"
            asset='foundry_new_sources.zip'
          fi
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,assets | jq -e --arg asset "$asset" '.isDraft == true and (.assets | any(.name == $asset))'
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "$asset" --dir build/foundry_r2
          mv "build/foundry_r2/$asset" build/foundry_r2/source.zip
          echo "source_tag=$tag" >> "$GITHUB_ENV"
      - name: Upload private R2 object and verify FULL readback SHA256
        env:
          FOUNDRY_R2_ACCOUNT_ID: ${{ vars.FOUNDRY_R2_ACCOUNT_ID }}
          FOUNDRY_R2_BUCKET: ${{ vars.FOUNDRY_R2_BUCKET }}
          FOUNDRY_R2_ACCESS_KEY_ID: ${{ secrets.FOUNDRY_R2_ACCESS_KEY_ID }}
          FOUNDRY_R2_SECRET_ACCESS_KEY: ${{ secrets.FOUNDRY_R2_SECRET_ACCESS_KEY }}
          SOURCE_CLASS: ${{ inputs.source_class }}
        run: |
          set -euo pipefail
          python tools/foundry_autonomy/archive_r2.py --source build/foundry_r2/source.zip --source-class "$SOURCE_CLASS" --release-tag "$source_tag" --report build/foundry_r2/verified.json
      - uses: actions/upload-artifact@v4
        with:
          name: foundry-r2-verification-${{ github.run_id }}
          path: build/foundry_r2/verified.json
          retention-days: 14
          if-no-files-found: error
