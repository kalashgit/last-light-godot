name: Foundry OpenMausBot portable-team contract
on:
  pull_request:
    paths:
      - 'docs/production/foundry-ai-last-light.mausteam.json'
      - 'tests/foundry/test_openmausbot_team_contract.py'
      - '.github/workflows/foundry-openmausbot-team.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-team:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests/foundry -p 'test_*.py' -v
