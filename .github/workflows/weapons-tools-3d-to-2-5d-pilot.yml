name: LAST LIGHT Weapons Tools Rugged 3D to 2.5D V3
on:
  push:
    branches:
      - codex/last-light-weapons-tools-refinement-v2-20261108
    paths:
      - "tools/weapons_tools/**"
      - "tests/weapons_tools_v1.py"
      - ".github/workflows/weapons-tools-3d-to-2-5d-pilot.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ll-weapons-tools-refinement-${{ github.ref }}
  cancel-in-progress: true

jobs:
  original-tool-models-and-sprites:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate immutable identities and executable recipe source
        run: |
          python tests/weapons_tools_v1.py
          python -m py_compile tools/weapons_tools/postprocess.py tests/weapons_tools_v1.py
      - name: Install headless Blender and Pillow
        run: |
          python -m pip install "Pillow>=10,<15"
          sudo apt-get update -qq
          sudo apt-get install -y blender python3-numpy
          blender --version | head -n 2
      - name: Build 11 rugged PBR editable 3D models and render locked-camera directions
        run: |
          mkdir -p build/weapons_tools
          set -o pipefail
          blender -b --factory-startup -t 2 --python tools/weapons_tools/build.py -- --output build/weapons_tools --samples 6 2>&1 | tee build/weapons_tools/blender.log
          grep -q 'LL_WEAPONS_TOOLS_BLEND_GLTF_ISO_PASS 11' build/weapons_tools/blender.log
      - name: Validate source files and create native sprites, manifest and contact sheet
        run: |
          python tools/weapons_tools/postprocess.py --sources build/weapons_tools --zip build/Last_Light_Weapons_Tools_Rugged_V3_11.zip
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          b=Path('build/weapons_tools')
          m=json.loads((b/'pilot_manifest.json').read_text())
          assert m['unique_3d_masters']==11
          assert m['world_rgba_frames']==44
          for x in m['items']:
              p=b/x['asset_id']
              assert len(x['world_frames'])==4
              for n in (32,48,64,128):
                  im=Image.open(p/f'icon_{n}.png').convert('RGBA')
                  assert im.size==(n,n) and im.getchannel('A').getbbox()
              for f in x['world_frames']:
                  im=Image.open(p/f['path']).convert('RGBA')
                  assert im.getchannel('A').getbbox()
                  assert f['ground_anchor_px']==x['world_frames'][0]['ground_anchor_px']
          print('LL_WEAPONS_TOOLS_FINAL_QA_PASS',len(m['items']))
          PY
      - name: Publish contact sheet and tested manifest on dedicated review branch
        run: |
          set -euo pipefail
          mkdir -p preview/weapons-tools-v1
          cp build/weapons_tools/weapons_tools_11_contact_sheet.png preview/weapons-tools-v1/
          cp build/weapons_tools/pilot_manifest.json preview/weapons-tools-v1/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview/weapons-tools-v1
          if ! git diff --cached --quiet; then
            git commit -m "Publish eleven rugged-material tool preview candidates"
            git pull --rebase origin codex/last-light-weapons-tools-refinement-v2-20261108
            git push origin HEAD:codex/last-light-weapons-tools-refinement-v2-20261108
          fi
      - name: Upload all actual 3D sources and PNG candidates for review
        uses: actions/upload-artifact@v4
        with:
          name: last-light-11-rugged-weapons-tools-editable-blend-glb-and-2-5d-v3
          path: |
            build/Last_Light_Weapons_Tools_Rugged_V3_11.zip
            build/weapons_tools/weapons_tools_11_contact_sheet.png
            build/weapons_tools/pilot_manifest.json
            build/weapons_tools/blender.log
          retention-days: 30
          if-no-files-found: error
