name: LAST LIGHT modular paperdoll and Y-sort acceptance (candidate)

on:
  pull_request:
    paths:
      - "scripts/foundry_paperdoll.gd"
      - "scenes/foundry_paperdoll_sort_lab.tscn"
      - "tests/foundry_paperdoll_smoke.gd"
      - "scripts/foundry_paperdoll_package.gd"
      - "tools/paperdoll_pack/**"
      - "tests/test_paperdoll_pack.py"
      - "tests/foundry_paperdoll_package_smoke.gd"
      - ".github/workflows/foundry-paperdoll-godot-qa.yml"
  workflow_dispatch:

concurrency:
  group: paperdoll-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  godot-headless-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned Godot 4.3 stable CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.3-stable_linux.x86_64
          /tmp/Godot_v4.3-stable_linux.x86_64 --headless --version
      - name: Install Pillow for offline original-image atlas packaging
        run: python3 -m pip install --break-system-packages 'Pillow>=10,<15'
      - name: Validate candidate atlas packing, provenance and hostile inputs
        run: python3 tests/test_paperdoll_pack.py -v
      - name: Emit original synthetic multilayer fixture (8 compass headings)
        run: python3 tests/test_paperdoll_pack.py --emit-fixture
      - name: Recheck produced atlas ZIP-equivalent inventory and hashes
        run: python3 tools/paperdoll_pack/pack.py --verify --output build/paperdoll_package
      - name: Import resources and reject parse errors
        run: /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path . --editor --import --quit
      - name: Exercise paperdoll and depth scene with real Godot
        run: timeout --signal=TERM --kill-after=5s 75s /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path . --script res://tests/foundry_paperdoll_smoke.gd
      - name: Test actual offline manifest and clothing swap inside Godot
        run: timeout --signal=TERM --kill-after=5s 75s /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path . --script res://tests/foundry_paperdoll_package_smoke.gd
